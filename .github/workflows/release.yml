name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: previoustag
        run: |
          # Find the most recent tag BEFORE the current tag
          prev_tag=$(git tag --sort=-creatordate | grep -v "^${{ github.ref_name }}$" | head -n 1)

          if [ -n "$prev_tag" ]; then
            echo "previous_tag=$prev_tag" >> $GITHUB_OUTPUT
            echo "Previous tag: $prev_tag"
          else
            echo "No previous tag found"
          fi

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          prev="${{ steps.previoustag.outputs.previous_tag }}"
          tag="${GITHUB_REF_NAME}"

          # Choose commit range
          if [ -n "$prev" ]; then
            log_range="${prev}..${tag}"
            changelog_title="## Changes in ${tag}"
          else
            log_range="${tag}"
            changelog_title="## Initial Release ${tag}"
          fi

          # Generate logs between tags
          changelog=$(git log ${log_range} --pretty=format:"- %s (%h)" || true)

          {
            echo "changelog<<EOD"
            echo "${changelog_title}"
            echo ""
            echo "$changelog"
            echo "EOD"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
